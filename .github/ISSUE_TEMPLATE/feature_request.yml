name: Feature request
description: Suggest an addition or change to the site or API
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or awkward right now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope check
      description: This project is educational only (see CLAUDE.md's Core Principles) — it does not sell insurance, guarantee pricing, or give personalized advice.
      options:
        - label: This request fits within that scope.
          required: true

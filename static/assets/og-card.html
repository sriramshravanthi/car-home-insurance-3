<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{ margin:0; padding:0; width:1200px; height:630px; overflow:hidden; }
  body{
    position: relative;
    background: linear-gradient(135deg, #0B1E3D, #061225);
    font-family: Georgia, "Times New Roman", serif;
    color: #ffffff;
  }
  .grid-overlay{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(70% 90% at 20% 10%, black, transparent);
  }
  .card{
    position: relative; z-index: 1;
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 80px;
    box-sizing: border-box;
  }
  h1{
    font-size: 56px; line-height: 1.15; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em;
    max-width: 920px;
  }
  h1 em{ color: #5B8DF0; font-style: italic; font-weight: 700; }
  p{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; color: #C9D3E4; margin: 22px 0 0; max-width: 760px; line-height: 1.5;
  }
  .brand{
    position: absolute; top: 72px; left: 80px; z-index: 2;
    display: flex; align-items: center; gap: 14px;
  }
  .brand .mark{
    width: 52px; height: 52px; border-radius: 14px; background: #1D4ED8;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: "IBM Plex Mono", "Courier New", monospace; font-weight: 700; font-size: 20px;
  }
  .brand .name{ font-weight: 700; font-size: 30px; color: #ffffff; }
  .badges{
    position: absolute; bottom: 66px; left: 80px; z-index: 2; display: flex; gap: 14px;
  }
  .badge{
    font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 16px; font-weight: 600;
    color: #ffffff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    padding: 10px 18px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="brand"><div class="mark">CC</div><div class="name">Coverage Check</div></div>
  <div class="card">
    <h1>Insurance advice you can<br><em>actually</em> verify.</h1>
    <p>Check your car or home insurance price and coverage against real published benchmarks &mdash; in your browser, with no sales pitch.</p>
  </div>
  <div class="badges">
    <div class="badge">1,800+ real prices tested</div>
    <div class="badge">50 states + D.C.</div>
    <div class="badge">0 ads or lead forms</div>
  </div>
</body>
</html>
